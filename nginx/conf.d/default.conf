# Local development reverse proxy (12_DEPLOY.md §6, AD-04).
# TLS termination, security headers, CSP and the static React build belong to the
# production configuration; this file covers the local topology only.

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:5173;
}

# Detección de rastreadores (AD-09, 05_API.md §6.1).
#
# 06_FRONTEND.md §17.1: renderizado del lado del cliente para personas,
# metadatos pre-renderizados para rastreadores. Ninguno de estos agentes ejecuta
# JavaScript, de modo que sin esta derivación recibirían el `index.html` vacío y
# la tarjeta de la red social saldría sin título ni imagen.
#
# Se compara sobre el agente completo y sin distinguir mayúsculas. El orden no
# importa: basta con que una alternativa case.
map $http_user_agent $pablito_crawler {
    default 0;

    # Meta: Facebook e Instagram comparten agente; WhatsApp trae el suyo.
    "~*facebookexternalhit"   1;
    "~*facebookcatalog"       1;
    "~*WhatsApp"              1;

    # X/Twitter, Discord, Telegram, LinkedIn, Slack.
    "~*Twitterbot"            1;
    "~*Discordbot"            1;
    "~*TelegramBot"           1;
    "~*LinkedInBot"           1;
    "~*Slackbot"              1;

    # Buscadores. Googlebot ejecuta JavaScript, pero servirle el documento
    # pre-renderizado le ahorra la cola de renderizado y adelanta la indexación.
    "~*Googlebot"             1;
    "~*bingbot"               1;
    "~*DuckDuckBot"           1;
    "~*Applebot"              1;
}

server {
    listen 80;
    server_name localhost;

    # 03_SEGURIDAD.md §12: no revelar la versión de Nginx, ni en el header
    # `Server` ni en las páginas de error por defecto. (Quitar del todo el
    # header `Server` requeriría el módulo `headers-more`, ausente en la imagen
    # oficial; `off` deja `Server: nginx` sin versión, que es lo pedido.)
    server_tokens off;

    # 03_SEGURIDAD.md §11.1 y §14.5: el límite real por archivo es 5 MB
    # (`MAX_CONTENT_LENGTH` de Flask, `core/config/base.py`). 6m deja la holgura
    # justa para el sobre multipart y los demás campos del formulario: una
    # subida de 5–6 MB llega a Flask y recibe SU 413 JSON de AD-16; por encima
    # de 6 MB la corta Nginx aquí y responde el mismo contrato (ver @error_413).
    client_max_body_size 6m;

    # Errores que genera **Nginx** (no los del upstream: `proxy_intercept_errors`
    # sigue en `off` por defecto, así que los 4xx/5xx JSON de Flask —incluido el
    # 404 de `/api/v1/*`— pasan intactos y NO se tocan aquí).
    error_page 413 = @error_413;
    error_page 502 503 504 = @error_upstream;

    location @error_413 {
        include /etc/nginx/security_headers;
        # S-09: sin `Cache-Control`. `expires` no alcanza a los códigos de error
        # (solo 2xx/3xx) y 413/503 no son heurísticamente cacheables
        # (RFC 9111 §4.2.2): ninguna caché conforme los guarda.
        default_type application/json;
        return 413 '{"success":false,"data":null,"errors":[{"code":"payload_too_large","rule":null,"detail":"uploaded content exceeds the maximum size","field":null}],"meta":{"request_id":null}}';
    }

    location @error_upstream {
        include /etc/nginx/security_headers;
        # Mismo motivo que en @error_413.
        default_type application/json;
        return 503 '{"success":false,"data":null,"errors":[{"code":"service_unavailable","rule":null,"detail":"service temporarily unavailable","field":null}],"meta":{"request_id":null}}';
    }

    # API JSON
    #
    # S-10: `security_headers` SÍ se incluye acá. Antes las emitía el middleware
    # de Flask y este `include` se omitía a propósito para no duplicarlas. Como
    # en producción el bloque `server` las añade igualmente, la respuesta salía
    # con `n=2`; ahora la fuente única es Nginx y en desarrollo hay que incluir
    # el archivo para que la cobertura sea la misma que en producción.
    location /api/v1/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params;
        include /etc/nginx/security_headers;
    }

    # Operational health checks
    location /health/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params;
        include /etc/nginx/security_headers;
    }

    # SEO endpoints for crawlers
    location /_seo/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params;
        include /etc/nginx/security_headers;
    }

    # robots.txt y sitemap.xml los genera Flask: el sitemap enumera productos,
    # categorías, marcas y deportes activos, que sólo el backend conoce.
    location = /robots.txt {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params;
        include /etc/nginx/security_headers;
    }

    location = /sitemap.xml {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params;
        include /etc/nginx/security_headers;
    }

    # --- Derivación por agente (AD-09) ---------------------------------
    #
    # Las personas reciben React; los rastreadores, el documento equivalente de
    # §6.2. La canónica del documento apunta a esta misma URL pública, no a
    # `/_seo/*`: es una representación de esta página, no otra página.
    #
    # Dentro de `if`, `proxy_pass` no admite parte de URI: se reescribe el URI
    # con `rewrite ... break` y se pasa sin ruta, que es la forma admitida. El
    # `include` va primero para que la localización implícita del `if` herede
    # las cabeceras.

    # Portada. §6.2 no define documento propio de portada, así que se sirve el
    # del catálogo: describe la tienda y enlaza a las fichas.
    location = / {
        include /etc/nginx/proxy_params;
        include /etc/nginx/security_headers;
        if ($pablito_crawler) {
            rewrite ^ /_seo/catalog break;
            proxy_pass http://backend;
        }
        proxy_pass http://frontend;
    }

    location = /catalogo {
        include /etc/nginx/proxy_params;
        include /etc/nginx/security_headers;
        if ($pablito_crawler) {
            rewrite ^ /_seo/catalog break;
            proxy_pass http://backend;
        }
        proxy_pass http://frontend;
    }

    # El slug viaja al documento de §6.2. La expresión excluye la barra para no
    # capturar rutas más profundas que no existen en §8.1.
    location ~ ^/producto/(?<product_slug>[^/]+)$ {
        include /etc/nginx/proxy_params;
        include /etc/nginx/security_headers;
        if ($pablito_crawler) {
            rewrite ^ /_seo/products/$product_slug break;
            proxy_pass http://backend;
        }
        proxy_pass http://frontend;
    }

    # Images served straight from the persistent volume (AD-05, DPL-04).
    #
    # 02_ARQUITECTURA.md §15.2: Nginx publica **solo** la rama de derivados. El
    # original es el activo autoritativo (AD-38) y no tiene ruta pública: el
    # alias apunta dentro de `derivatives/`, de modo que `originals/` queda
    # inalcanzable desde fuera aunque comparta volumen.
    location /uploads/ {
        alias /var/lib/pablito/uploads/derivatives/;
        include /etc/nginx/security_headers;
        access_log off;
        # §15.7: el nombre incorpora la huella del contenido (§15.3 regla 2), así
        # que el derivado admite cacheo indefinido: si cambia la imagen cambia el
        # nombre y no hay invalidación que gestionar.
        #
        # S-09: antes había `expires 1y` **y** `add_header Cache-Control`, y cada
        # uno emite la suya -> se medían DOS `Cache-Control` (`max-age=31536000`
        # y `public, immutable`) más un `Expires`. Una sola fuente: el
        # `add_header`, que es el único que sabe decir `immutable`. Mismo valor
        # exacto que producción, para que dev no mienta sobre lo que se despliega.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Un derivado faltante es un asset ausente, no una página: 404 sin cuerpo
        # ni HTML genérico (el navegador solo necesita el código).
        try_files $uri @uploads_missing;
    }

    location @uploads_missing {
        internal;
        include /etc/nginx/security_headers;
        # Un derivado ausente no debe quedar guardado: un 404 SÍ es
        # heurísticamente cacheable (RFC 9111 §4.2.2), y durante un fallo de
        # montaje del volumen quedaría guardado y la imagen no volvería.
        # `expires` NO sirve acá: solo actúa sobre 200/201/204/206/3xx, y esto es
        # un 404 (comprobado: con `expires epoch` la respuesta seguía saliendo
        # sin `Cache-Control`). Hace falta `add_header ... always`. Esta
        # localización ya rompe la herencia con `security_headers`, así que el
        # `add_header` no cuesta ninguna cabecera adicional.
        add_header Cache-Control "no-store" always;
        # `types {}` limpia el mapa MIME heredado para que el cuerpo JSON no
        # salga anunciado como `image/*` por la extensión de la URL.
        types { }
        default_type application/json;
        return 404 '{"success":false,"data":null,"errors":[{"code":"resource_not_found","rule":null,"detail":"resource not found or not visible","field":null}],"meta":{"request_id":null}}';
    }

    # Everything else goes to the Vite dev server (SPA + HMR websocket)
    location / {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params;
        include /etc/nginx/security_headers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
